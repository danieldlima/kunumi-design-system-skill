<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Non-compliant card</title>
  <style>
    :root {
      --kunumi-font-display: "Space Grotesk", Arial, sans-serif;
    }
    body {
      background: #000000;
      color: #ffffff;
    }
    .kunumi-display {
      font-family: var(--kunumi-font-display);
      letter-spacing: -0.02em;
    }
    .kunumi-body {
      line-height: 1.2;
    }
    .card {
      border-radius: 8px;
      padding: 22px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2 class="kunumi-display">Inteligencia para o que ainda nao tem nome</h2>
    <p class="kunumi-body">Texto de apoio.</p>
  </div>
</body>
</html>
