<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Focus outline replaced</title>
  <style>
    :root { --kunumi-urucum: #F04E44; }
    .action { border-radius: 10px; padding: 8px 16px; }
    .action:focus:not(:focus-visible) { outline: none; }
    .action:focus-visible { outline: 2px solid var(--kunumi-urucum); outline-offset: 2px; }
    .field:focus { outline: 0; box-shadow: 0 0 0 2px var(--kunumi-urucum); }
  </style>
</head>
<body>
  <button class="action" type="button">Explorar</button>
  <input class="field" type="text" aria-label="Busca" />
</body>
</html>
