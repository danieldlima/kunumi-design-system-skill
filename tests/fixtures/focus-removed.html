<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Focus outline removed</title>
  <style>
    .action { border-radius: 10px; padding: 8px 16px; }
    .action:focus { outline: none; }
  </style>
</head>
<body>
  <button class="action" type="button">Explorar</button>
</body>
</html>
